
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login Clone</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main-container">

        <!-- LEFT SECTION -->
        <section class="left-section">

            <!-- Instagram Logo -->
            <div class="instagram-logo">
                <i class="bi bi-instagram"></i>
            </div>

            <!-- Main Heading -->
            <div class="promo-heading">
                <h1>
                    See everyday moments from your
                    <span>close friends</span>
                </h1>
            </div>

            <!-- Image Collage -->
            <div class="image-collage">

                <div class="story-card card-one">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400" alt="Friend">
                </div>

                <div class="story-card card-two">
                    <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400" alt="Friends">
                </div>

                <div class="story-card card-three">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="Friend">
                </div>

                <div class="reaction reaction-one">💗</div>
                <div class="reaction reaction-two">✨</div>
                <div class="reaction reaction-three">💚</div>

            </div>

        </section>


        <!-- RIGHT LOGIN SECTION -->
        <section class="right-section">

            <div class="login-container">

                <h5>Log into Instagram</h5>

                <!-- Login Form -->
                <form action="#" method="get">

                    <div class="mb-3">
                        <input
                            type="text"
                            class="form-control login-input"
                            placeholder="Mobile number, username or email"
                            autocomplete="username"
                            required>
                    </div>

                    <div class="mb-3">
                        <input
                            type="password"
                            class="form-control login-input"
                            placeholder="Password"
                            autocomplete="current-password"
                            required>
                    </div>

                    <button type="button" class="btn login-button w-100">
                        Log in
                    </button>

                </form>

                <!-- Forgot Password -->
                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>

                <!-- Facebook Login -->
                <div class="facebook-login">
                    <a href="#">
                        <i class="bi bi-facebook"></i>
                        Log in with Facebook
                    </a>
                </div>

                <!-- Create Account -->
                <div class="create-account">
                    <a href="#">Create new account</a>
                </div>

                <!-- Meta Branding -->
                <div class="meta-logo">
                    <span>∞</span> Meta
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Locations</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Meta AI</a>
            <a href="#">Threads</a>
            <a href="#">Contact Uploading & Non-Users</a>
            <a href="#">Meta Verified</a>
        </div>

        <div class="footer-bottom">
            <span>English</span>
            <span>© 2026 Instagram from Meta</span>
        </div>

    </footer>

</body>
</html>

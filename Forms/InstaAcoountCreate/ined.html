
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">

        <div class="left-panel">
            <div class="logo">◎</div>

            <h2>
                See everyday moments from
                <br>
                your <span>close friends.</span>
            </h2>

            <div class="photo-stack">
                <div class="photo photo-one">📸</div>
                <div class="photo photo-two">👫</div>
                <div class="photo photo-three">💖</div>
            </div>

            <div class="app-store">App Store</div>
        </div>

        <div class="right-panel">
            <form class="login-form">
                <p>Log into Instagram</p>

                <input
                    type="text"
                    placeholder="Mobile number, username or email"
                    required
                >

                <input
                    type="password"
                    placeholder="Password"
                    required
                >

                <button type="submit" class="login-button">
                    Log in
                </button>

                <a href="#" class="forgot">Forgot password?</a>

                <button type="button" class="facebook-button">
                    <span>f</span> Log in with Facebook
                </button>

                <button type="button" class="create-button">
                    Create new account
                </button>
            </form>
        </div>

    </div>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Championship Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="registration-form">
        <h1>School Championship Registration Form</h1>

        <form>
            <div class="field">
                <label for="school">School name:<span>*</span></label>
                <input type="text" id="school" required>
            </div>

            <div class="field">
                <label>Schooler name:<span>*</span></label>
                <div class="two-columns">
                    <input type="text" placeholder="First" required>
                    <input type="text" placeholder="Last" required>
                </div>
            </div>

            <div class="field">
                <label>Parent name:<span>*</span></label>
                <div class="two-columns">
                    <input type="text" placeholder="First" required>
                    <input type="text" placeholder="Last" required>
                </div>
            </div>

            <div class="field">
                <label for="phone">Parent phone:<span>*</span></label>
                <input type="tel" id="phone"
                       placeholder="### ### ####" required>
            </div>

            <div class="field">
                <label for="email">Parent email:<span>*</span></label>
                <input type="email" id="email" required>
            </div>

            <div class="field">
                <label for="sport">Preferred sport:<span>*</span></label>
                <input type="text" id="sport" required>
            </div>

            <div class="verification">
                <label><strong>Verification<span>*</span></strong></label>
                <label class="robot">
                    <input type="checkbox" required>
                    <span>I'm not a robot</span>
                    <span class="captcha-icon">🔄</span>
                </label>
                <small>reCAPTCHA<br>Privacy - Terms</small>
            </div>

            <button type="submit">➤ &nbsp; Submit</button>
        </form>
    </div>

</body>
</html>

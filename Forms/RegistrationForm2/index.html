
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <form action="#">
            <h2>Registration</h2>

            <h4>Personal Details</h4>

            <div class="form-grid">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>

                <div class="field">
                    <label>Date of Birth</label>
                    <input type="text" placeholder="Enter birth date">
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="field">
                    <label>Mobile number</label>
                    <input type="tel" placeholder="Enter mobile number">
                </div>

                <div class="field">
                    <label>Gender</label>
                    <input type="text" placeholder="Enter your gender">
                </div>

                <div class="field">
                    <label>Occupation</label>
                    <input type="text" placeholder="Enter occupation">
                </div>
            </div>

            <h4 class="identity-heading">Identity Details</h4>

            <div class="form-grid">
                <div class="field">
                    <label>ID Type</label>
                    <input type="text" placeholder="Enter ID type">
                </div>

                <div class="field">
                    <label>ID Number</label>
                    <input type="text" placeholder="Enter ID number">
                </div>

                <div class="field">
                    <label>Issue Authority</label>
                    <input type="text" placeholder="Enter issue department">
                </div>

                <div class="field">
                    <label>Issue Date</label>
                    <input type="text" placeholder="Enter ID issue date">
                </div>

                <div class="field">
                    <label>Issue State</label>
                    <input type="text" placeholder="Enter ID issue state">
                </div>

                <div class="field">
                    <label>Expiry Date</label>
                    <input type="text" placeholder="Enter ID expiry date">
                </div>
            </div>

            <button type="button" class="next-button">
                Next <span>➜</span>
            </button>
        </form>
    </div>

</body>
</html>

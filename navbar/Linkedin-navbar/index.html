
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Navbar</title>

    <link rel="stylesheet" href="./syle.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<nav class="linkedin-navbar">

    <div class="left-section">
        <div class="linkedin-logo">in</div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search">
        </div>
    </div>

    

<div class="nav-links">

    <input type="radio" name="nav" id="home" checked>
    <label for="home" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </label>

    <input type="radio" name="nav" id="network">
    <label for="network" class="nav-item">
        <i class="fa-solid fa-user-group"></i>
        <b class="badge">5</b>
        <span>My Network</span>
    </label>

    <input type="radio" name="nav" id="jobs">
    <label for="jobs" class="nav-item">
        <i class="fa-solid fa-briefcase"></i>
        <span>Jobs</span>
    </label>

    <input type="radio" name="nav" id="messaging">
    <label for="messaging" class="nav-item">
        <i class="fa-solid fa-comment-dots"></i>
        <span>Messaging</span>
    </label>

    <input type="radio" name="nav" id="notifications">
    <label for="notifications" class="nav-item">
        <i class="fa-solid fa-bell"></i>
        <b class="badge">20</b>
        <span>Notifications</span>
    </label>

    <input type="radio" name="nav" id="me">
    <label for="me" class="nav-item">
        <i class="fa-solid fa-circle-user"></i>
        <span>Me <i class="fa-solid fa-caret-down arrow"></i></span>
    </label>

    <input type="radio" name="nav" id="business">
    <label for="business" class="nav-item business">
        <i class="fa-solid fa-grip"></i>
        <span>For Business <i class="fa-solid fa-caret-down arrow"></i></span>
    </label>

    <input type="radio" name="nav" id="premium">
    <label for="premium" class="nav-item premium">
        <i class="fa-solid fa-square"></i>
        <span>Try Premium for ₹0</span>
    </label>

</div>


</nav>

</body>
</html>

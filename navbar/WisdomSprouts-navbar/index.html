
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisdom Sprouts Navbar</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header class="wisdom-navbar">

    <!-- Logo -->
    <a href="#" class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-seedling"></i>
        </div>

        <div class="brand-name">
            <span>WISDOM</span>
            <span>SPROUTS</span>
            <small>IT Training Hub</small>
        </div>
    </a>

    <!-- Navigation -->
    <nav class="nav-links">

        <input type="radio" name="nav" id="home" checked>
        <label for="home" class="nav-item">Home</label>

        <input type="radio" name="nav" id="about">
        <label for="about" class="nav-item">About Us</label>

        <input type="radio" name="nav" id="courses">
        <label for="courses" class="nav-item">Courses</label>

        <input type="radio" name="nav" id="blogs">
        <label for="blogs" class="nav-item">Blogs</label>

        <input type="radio" name="nav" id="placements">
        <label for="placements" class="nav-item">Placements</label>

        <input type="radio" name="nav" id="internship">
        <label for="internship" class="nav-item">Internship</label>

        <input type="radio" name="nav" id="gallery">
        <label for="gallery" class="nav-item">Gallery</label>

        <input type="radio" name="nav" id="hire">
        <label for="hire" class="nav-item">Hire From Us</label>

    </nav>

    <!-- Contact button -->
    <a href="mailto:info@wisdomsprouts.in" class="contact-btn">
        Contact Us
    </a>

</header>

</body>
</html>
